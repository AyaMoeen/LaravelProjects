networks:
  monitoring_net:
    external: true

services:
  secoundproject:
    image: laravelsail/php82-composer   
    container_name: secoundproject
    ports:
      - "8001:8000"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - monitoring_net